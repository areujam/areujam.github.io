---
layout: default
---

<main class="note-page" id="main-content">
  <a class="note-page__back" href="/notes/">← All notes</a>
  <header class="note-page__header">
    {% if page.series %}<p class="eyebrow">{{ page.series }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    <p class="note-page__meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% if page.read_time %} · {% include read-time.html %}{% endif %}</p>
    {% if page.excerpt %}<p class="note-page__lead">{{ page.excerpt }}</p>{% endif %}
  </header>
  <article class="note-page__content">
    {{ content }}
  </article>
</main>
